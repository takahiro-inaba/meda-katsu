<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メダ活 ビオトープ台帳</title>
<link rel="stylesheet" href="src/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M12 2.5c3.4 4 5.2 6.8 5.2 9.1A5.2 5.2 0 0 1 12 16.8a5.2 5.2 0 0 1-5.2-5.2c0-2.3 1.8-5.1 5.2-9.1Z" stroke-linejoin="round"/>
        <path d="M2.6 19.4c1.6 0 1.6 1.5 3.1 1.5s1.6-1.5 3.1-1.5 1.6 1.5 3.2 1.5 1.6-1.5 3.1-1.5 1.6 1.5 3.1 1.5 1.6-1.5 3.2-1.5" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="brand-name">メダ活</div>
        <div class="brand-sub">BIOTOPE LEDGER</div>
      </div>
    </div>

    <div>
      <label class="label" for="biotope-select">ビオトープ</label>
      <select class="select" id="biotope-select"></select>
      <button class="btn quiet sm" data-action="add-biotope" style="margin-top:6px">＋ ビオトープを追加</button>
    </div>

    <nav class="nav" aria-label="メインメニュー">
      <button class="nav-item" data-action="view" data-view="dashboard">ダッシュボード</button>
      <button class="nav-item" data-action="view" data-view="creatures">生き物<span class="nav-count" data-count="creatures"></span></button>
      <button class="nav-item" data-action="view" data-view="water">水質<span class="nav-count" data-count="water"></span></button>
      <button class="nav-item" data-action="view" data-view="logs">作業ログ<span class="nav-count" data-count="logs"></span></button>
    </nav>

    <div class="sidebar-foot">
      <button class="btn ghost sm" data-action="backup">バックアップ / 復元</button>
      <p class="muted" style="font-size:11px; margin:4px 0 0; line-height:1.5">
        記録はこのブラウザの中にだけ保存されます。別の端末とは共有されません。
      </p>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<dialog id="biotope-dialog">
  <form id="biotope-form" class="dialog-body">
    <h2 class="dialog-title">ビオトープを追加</h2>
    <label><span class="label">名前</span><input class="input" name="name" placeholder="玄関前のトロ舟" required></label>
    <label><span class="label">立ち上げた日</span><input class="input" name="startedAt" type="date"></label>
    <div class="form-actions">
      <button class="btn ghost" type="button" data-action="close-dialog">やめる</button>
      <button class="btn" type="submit">追加する</button>
    </div>
  </form>
</dialog>

<dialog id="backup-dialog">
  <form id="restore-form" class="dialog-body">
    <h2 class="dialog-title">バックアップ / 復元</h2>
    <p class="muted" style="margin:0; font-size:13px">
      下の JSON をコピーして保管しておけば、別のブラウザでも貼り付けて復元できます。
    </p>
    <textarea class="textarea" id="backup-text" rows="10" spellcheck="false" style="font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px"></textarea>
    <div class="form-actions">
      <button class="btn ghost" type="button" id="copy-backup">JSONをコピー</button>
      <button class="btn ghost" type="button" data-action="close-dialog">閉じる</button>
      <button class="btn" type="submit">この内容で復元する</button>
    </div>
  </form>
</dialog>

<script src="src/app.js"></script>
</body>
</html>
